name: Sync Upstream

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动同步
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream via merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/clawbench-dev/clawbench.git
          git fetch upstream main

          # Check if there are new upstream commits
          NEW_COMMITS=$(git log --oneline HEAD..upstream/main | wc -l | tr -d ' ')
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "✅ Already up to date."
            exit 0
          fi

          echo "📥 Found $NEW_COMMITS new upstream commit(s):"
          git log --oneline HEAD..upstream/main

          # Check fork-only commits
          FORK_COMMITS=$(git log --oneline upstream/main..HEAD)
          FORK_COUNT=$(echo "$FORK_COMMITS" | grep -c . || true)

          if [ "$FORK_COUNT" -eq 0 ]; then
            echo "No fork-only commits, fast-forwarding..."
            git merge --ff-only upstream/main
            git push origin main
            echo "✅ Fast-forward sync complete."
            exit 0
          fi

          echo "📋 Merging $NEW_COMMITS upstream commit(s) onto $FORK_COUNT fork commit(s):"
          echo "Fork-only commits:"
          echo "$FORK_COMMITS"

          # Three-way merge upstream into fork. Unlike rebase, merge does not
          # replay each fork commit individually onto upstream — it reconciles
          # the two tips in one pass, so fork-local code that has already been
          # adapted to the latest upstream architecture merges cleanly.
          if ! git merge upstream/main --no-edit; then
            echo ""
            echo "❌ Merge conflict detected — cannot auto-resolve."
            git merge --abort 2>/dev/null || true
            echo ""
            echo "::error::Merge conflicts — manual sync required. Run locally: git fetch upstream && git merge upstream/main"
            exit 1
          fi

          # Merge succeeded, push normally (no force needed with merge strategy)
          git push origin main
          echo "✅ Merge sync complete. $NEW_COMMITS upstream commit(s) merged onto $FORK_COUNT fork commit(s)."
